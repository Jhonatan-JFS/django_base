<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at top left, rgba(116, 92, 255, 0.35), transparent 35%),
                radial-gradient(circle at bottom right, rgba(0, 212, 255, 0.25), transparent 35%),
                linear-gradient(135deg, #10131f, #181c2b, #0d1018);

            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;

            padding: 45px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;

            backdrop-filter: blur(14px);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35),
                0 0 40px rgba(116, 92, 255, 0.08);

            animation: aparecer 0.8s ease;
        }

        .topo {
            text-align: center;
            margin-bottom: 35px;
        }

        .icone {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            font-size: 32px;

            background: linear-gradient(
                135deg,
                #745cff,
                #00bcd4
            );

            box-shadow:
                0 10px 30px rgba(116, 92, 255, 0.4);
        }

        h1 {
            font-size: 2.3rem;
            margin-bottom: 10px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #bfc7ff,
                #7ee8fa
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .descricao {
            color: #b7bfd3;
            line-height: 1.6;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #dfe4f2;

            font-size: 0.95rem;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;

            padding: 14px 16px;

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;

            outline: none;

            background: rgba(255, 255, 255, 0.07);

            color: white;

            font-size: 1rem;

            transition: 0.3s;
        }

        input::placeholder,
        textarea::placeholder {
            color: #79829a;
        }

        input:focus,
        textarea:focus {
            border-color: #745cff;

            box-shadow:
                0 0 0 3px rgba(116, 92, 255, 0.15);

            background: rgba(255, 255, 255, 0.1);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        .botao {
            width: 100%;

            padding: 15px;

            border: none;
            border-radius: 12px;

            cursor: pointer;

            font-size: 1rem;
            font-weight: bold;

            color: white;

            background: linear-gradient(
                135deg,
                #745cff,
                #4b8cff
            );

            box-shadow:
                0 8px 25px rgba(91, 92, 255, 0.35);

            transition: 0.3s;
        }

        .botao:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 35px rgba(91, 92, 255, 0.5);
        }

        .rodape {
            margin-top: 25px;

            text-align: center;

            color: #7f899e;

            font-size: 0.9rem;
        }

        .rodape a {
            color: #8da2ff;
            text-decoration: none;
        }

        .rodape a:hover {
            text-decoration: underline;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 22px;
            }

            h1 {
                font-size: 1.9rem;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="topo">

            <div class="icone">
                ✉
            </div>

            <h1>Entre em Contato</h1>

            <p class="descricao">
                Tem alguma dúvida ou deseja falar conosco?
                Preencha o formulário abaixo.
            </p>

        </div>

        <form method="POST">

            <div class="campo">
                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="campo">
                <label for="assunto">Assunto</label>

                <input
                    type="text"
                    id="assunto"
                    name="assunto"
                    placeholder="Sobre o que deseja falar?"
                    required
                >
            </div>

            <div class="campo">
                <label for="mensagem">Mensagem</label>

                <textarea
                    id="mensagem"
                    name="mensagem"
                    placeholder="Digite sua mensagem..."
                    required
                ></textarea>
            </div>

            <button type="submit" class="botao">
                Enviar mensagem
            </button>

        </form>

        <div class="rodape">
            <p>
                Ou volte para a
                <a href="/">página inicial</a>
            </p>
        </div>

    </main>

</body>
</html>
